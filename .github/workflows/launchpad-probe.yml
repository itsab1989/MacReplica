name: Launchpad probe

# Manual only: inspects the Launchpad database on macOS 14 and 15 runners (schema, item types, structure)
# for MacReplica's Launchpad layout support. Changes nothing.
on:
  workflow_dispatch:
  push:
    branches: [feature/knut-round3]
    paths: [.github/workflows/launchpad-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Launchpad database
        run: |
          sw_vers
          ls /System/Applications | grep -i launchpad || echo "no Launchpad.app"
          pgrep -l Dock || echo "Dock not running"
          DIR="$(getconf DARWIN_USER_DIR)com.apple.dock.launchpad/db"
          echo "folder: $DIR"; ls -la "$DIR" || true
          # Launchpad creates its database when it is opened the first time.
          if [ ! -f "$DIR/db" ]; then open -a Launchpad || true; sleep 8; osascript -e 'tell application "System Events" to key code 53' || true; sleep 2; ls -la "$DIR" || true; fi
          [ -f "$DIR/db" ] || exit 0
          cp "$DIR"/db* "$RUNNER_TEMP"/ && DB="$RUNNER_TEMP/db"
          sqlite3 "$DB" ".schema"
          echo "--- dbinfo"; sqlite3 "$DB" "select * from dbinfo;"
          echo "--- item types"; sqlite3 "$DB" "select type, count(*) from items group by type;"
          echo "--- special items"; sqlite3 "$DB" "select rowid, uuid, type, parent_id, ordering from items where uuid in ('ROOTPAGE','HOLDINGPAGE','HOLDINGPAGE_VERSION') or parent_id=0;"
          echo "--- pages and folders"; sqlite3 "$DB" "select i.rowid, i.type, i.parent_id, i.ordering, g.title from items i left join groups g on g.item_id=i.rowid where i.type not in (4) order by i.parent_id, i.ordering limit 60;"
          echo "--- first apps"; sqlite3 "$DB" "select i.rowid, i.parent_id, i.ordering, a.bundleid from items i join apps a on a.item_id=i.rowid order by i.parent_id, i.ordering limit 25;"
          echo "--- triggers"; sqlite3 "$DB" "select name from sqlite_master where type='trigger';"
