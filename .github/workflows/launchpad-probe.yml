name: Launchpad validation

# Validates MacReplica's Launchpad layout restore on real macOS 14 and 15: Launchpad is reset to Apple's default
# (as after a fresh installation), a recorded layout is rebuilt, the Dock restarts, and the layout is read back
# and photographed. Runs only on demand and for changes of this file on the feature branch.
on:
  workflow_dispatch:
  push:
    branches: [feature/knut-round3]
    paths: [.github/workflows/launchpad-probe.yml, Sources/MacReplicaCore/Launchpad/**, Sources/MacReplicaSimulator/main.swift]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release --arch arm64 --product MacReplicaSimulator && cp "$(swift build -c release --arch arm64 --show-bin-path)/MacReplicaSimulator" simulator
      - uses: actions/upload-artifact@v7
        with:
          name: simulator
          path: simulator

  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: simulator
      - name: Reset, rebuild, restart the Dock, read back
        run: |
          chmod +x simulator; sw_vers
          ./simulator launchpad-export original.json
          # A fresh installation: Launchpad in Apple's default arrangement.
          defaults write com.apple.dock ResetLaunchPad -bool true; killall Dock; sleep 12
          ./simulator launchpad-export fresh.json
          cat > recorded.json <<'JSON'
          {"macOSVersion": "14", "pages": [
            [{"folder": {"name": "MacReplica Test", "pages": [["com.apple.Safari", "com.apple.Notes", "com.apple.TextEdit"]]}},
             {"app": {"_0": "com.apple.AppStore"}}, {"app": {"_0": "com.apple.mail"}}],
            [{"folder": {"name": "Werkzeuge & Co", "pages": [["com.apple.calculator", "com.apple.Preview"]]}}]
          ]}
          JSON
          ./simulator launchpad-apply recorded.json
          open -a Launchpad; sleep 4; screencapture -x launchpad.png || true
          osascript -e 'tell application "System Events" to key code 53' || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launchpad-${{ matrix.os }}
          path: |
            *.json
            launchpad.png
