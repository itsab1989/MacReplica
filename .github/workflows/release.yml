name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Secrets cannot be used in `if:` directly; these only say whether they are configured.
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the app version
        run: |
          version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/MacReplicaCore/System/SystemInfo.swift)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match MacReplicaVersion.current $version"; exit 1; }
          grep -q "## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Tests
        run: scripts/test.sh
      - name: Import signing certificate (optional)
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build app and disk image
        env:
          MACREPLICA_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACREPLICA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/build-app.sh build
          scripts/make-dmg.sh build
      - name: Notarize (optional)
        if: env.HAS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          scripts/notarize.sh build/MacReplica-*.dmg
          # Stapling changes the disk image, so its checksum is written again.
          cd build && for f in MacReplica-*.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > build/notes.md
          cat >> build/notes.md <<'NOTES'

          ## Download and install

          1. Download `MacReplica-<version>.dmg` below (the `.sha256` file contains its checksum).
          2. Open it and drag **MacReplica** into **Applications**.
          NOTES
          if [ "$HAS_NOTARIZATION" != "true" ]; then
            echo '3. This build is not notarized: on first launch open **System Settings → Privacy & Security** and click **Open Anyway** (on macOS 13 and 14 you can also Control-click the app and choose **Open**).' >> build/notes.md
          fi
          cat >> build/notes.md <<'NOTES'

          Requires macOS 13 or later; universal binary for Apple silicon and Intel. Known limitations: see the [README](https://github.com/itsab1989/MacReplica#known-limitations).

          MacReplica is free and always will be. If it's useful to you, a coffee is a kind way to say thanks — completely optional: [Ko-fi](https://ko-fi.com/itsab1989).
          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/MacReplica-*.dmg build/MacReplica-*.dmg.sha256 \
            --title "MacReplica ${GITHUB_REF_NAME#v}" --notes-file build/notes.md $prerelease
