name: Reproduce tester issues (1.1.3)

# Throw-away reproduction for a tester's report on 1.1.3 (branch repro/knut-1.1.3 only, never merged):
# 1. macOS 14: MacReplica 1.1.3 cannot find the Launchpad database although Launchpad works.
# 2. Intel: Microsoft Office did not install through Homebrew with an old Homebrew (as restored by Time Machine).
on:
  push:
    branches: [repro/knut-1.1.3]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/1.1.7-launchpad-and-selection
      - uses: actions/checkout@v7
        with:
          path: repro-branch
      - run: cp -R repro-branch/repro .
      - name: Build MacReplica's Launchpad tool (arm64) and a Finder-style probe app
        run: |
          swift build -c release --arch arm64 --product MacReplicaSimulator
          mkdir tool && cp "$(swift build -c release --arch arm64 --show-bin-path)/MacReplicaSimulator" tool/sim
          cp -R "$(swift build -c release --arch arm64 --show-bin-path)/MacReplica_MacReplicaCore.bundle" tool/
          mkdir -p tool/Probe.app/Contents/MacOS
          swiftc -O -target arm64-apple-macos13 repro/LaunchpadProbe.swift -o tool/Probe.app/Contents/MacOS/Probe
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Probe" -c "Add :CFBundleIdentifier string io.example.launchpadprobe" \
            -c "Add :CFBundlePackageType string APPL" tool/Probe.app/Contents/Info.plist
          codesign -s - --force tool/Probe.app
      - uses: actions/upload-artifact@v7
        with:
          name: tool
          path: tool

  launchpad:
    needs: build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tool
      - run: chmod +x sim Probe.app/Contents/MacOS/Probe; sw_vers; uname -m
      - name: Probe, rewrite with MacReplica's code, restart the Dock, probe again
        run: |
          set +e -x
          mkdir -p out
          DB="$(getconf DARWIN_USER_DIR)com.apple.dock.launchpad/db"
          echo "shell DARWIN_USER_DIR=$(getconf DARWIN_USER_DIR)"
          ls -la "$DB" || true
          ./Probe.app/Contents/MacOS/Probe out/1-terminal.txt
          open -n Probe.app --args "$PWD/out/2-launchservices.txt"; sleep 5; cat out/2-launchservices.txt
          ./sim launchpad-export out/original.json
          cat > recorded.json <<'JSON'
          {"macosVersion": "14", "pages": [[{"folder": {"name": "Backup & Safety", "pages": [["com.apple.Safari", "com.apple.Notes"]]}}, {"app": "com.apple.mail"}]]}
          JSON
          ./sim launchpad-apply recorded.json | tee out/3-apply.txt || true
          ls -la "$DB" | tee out/4-after-apply-ls.txt
          killall Dock; sleep 10
          ls -la "$DB" | tee out/5-after-dock-restart-ls.txt
          open -n Probe.app --args "$PWD/out/6-launchservices-after.txt"; sleep 5; cat out/6-launchservices-after.txt
          ./sim launchpad-export out/7-after.json || echo EXPORT_FAILED
          # The tester's advice check: if the database is missing, does opening Launchpad (or a Dock restart) recreate it?
          killall -STOP Dock; mv "$DB" "$DB.aside"; killall -KILL Dock; sleep 10
          ls -la "$DB" 2>&1 | tee out/8-missing-after-dock-restart.txt
          open -a Launchpad; sleep 6; osascript -e 'tell application "System Events" to key code 53' || true; sleep 2
          ls -la "$DB" 2>&1 | tee out/9-after-opening-launchpad.txt
          screencapture -x out/launchpad.png || true
          # 1.1.4 report: the folder MacReplica computes has no com.apple.dock.launchpad, yet the Dock works.
          # Does the running Dock show which database it has open (lsof on the user's own process, no root)?
          for round in 1 2 3; do
            echo "== round $round"; lsof -a -c Dock -Fn 2>/dev/null | grep -E "^n.*com\.apple\.dock\.launchpad/db/db" | tee -a out/10-lsof.txt
            lsof -a -p "$(pgrep -x -u "$(id -u)" Dock)" -Fn 2>/dev/null | grep -c "launchpad" | tee -a out/10-lsof.txt
            killall Dock; sleep 8
          done
          echo "computed: $(getconf DARWIN_USER_DIR)com.apple.dock.launchpad/db/db" | tee -a out/10-lsof.txt
          echo "== MacReplica's lookup, normal case" | tee out/11-locate.txt
          ./sim launchpad-locate | tee -a out/11-locate.txt; echo "exit=$?" | tee -a out/11-locate.txt
          # The tester's case: the user's folder has no com.apple.dock.launchpad, but the Dock has its database open.
          LP="$(getconf DARWIN_USER_DIR)com.apple.dock.launchpad"
          killall -STOP Dock; mv "$LP" "$LP.elsewhere"
          echo "== MacReplica's lookup, user's folder without Launchpad" | tee -a out/11-locate.txt
          ./sim launchpad-locate | tee -a out/11-locate.txt; echo "exit=${PIPESTATUS[0]}" | tee -a out/11-locate.txt
          echo "== raw lsof, Dock paused, folder renamed" | tee -a out/11-locate.txt
          lsof -a -c Dock -Fn 2>&1 | grep -i -E "launchpad|^p" | tee -a out/11-locate.txt
          lsof -p "$(pgrep -x Dock)" 2>&1 | grep -i launchpad | tee -a out/11-locate.txt
          killall -CONT Dock; sleep 1
          echo "== raw lsof, Dock running, folder still renamed" | tee -a out/11-locate.txt
          lsof -a -c Dock -Fn 2>&1 | grep -i -E "launchpad|^p" | tee -a out/11-locate.txt
          ./sim launchpad-locate | tee -a out/11-locate.txt
          killall -STOP Dock
          mv "$LP.elsewhere" "$LP"; killall -CONT Dock; sleep 2
          ./sim launchpad-locate | tee -a out/11-locate.txt
          # Hypothesis from the tester's 1.1.5 log: MacReplica started as another user (sudo keeps HOME on macOS).
          echo "== as root with sudo (HOME kept)" | tee -a out/12-sudo.txt
          sudo -E env HOME="$HOME" ./sim launchpad-locate 2>&1 | tee -a out/12-sudo.txt
          echo "== as root with sudo -H" | tee -a out/12-sudo.txt
          sudo -H ./sim launchpad-locate 2>&1 | tee -a out/12-sudo.txt
          echo "== as the logged-in user" | tee -a out/12-sudo.txt
          ./sim launchpad-locate 2>&1 | tee -a out/12-sudo.txt
          # 1.1.7 checks on the real Dock.
          LP="$(getconf DARWIN_USER_DIR)com.apple.dock.launchpad"
          echo "== 1.1.7: Dock without database, then a normal Dock restart (what 'Restart the Dock' does)" | tee out/13-117.txt
          killall -STOP Dock; mv "$LP" "$LP.gone"; killall -KILL Dock; sleep 1; killall -STOP Dock 2>/dev/null
          ls -la "$LP/db" 2>&1 | head -3 | tee -a out/13-117.txt
          killall -CONT Dock 2>/dev/null; sleep 8; ls -la "$LP/db" 2>&1 | head -5 | tee -a out/13-117.txt
          killall -TERM Dock; sleep 10; echo "after killall -TERM:" | tee -a out/13-117.txt; ls -la "$LP/db" 2>&1 | head -5 | tee -a out/13-117.txt
          echo "== 1.1.7: an app whose identifier changed is placed by its name (real Dock)" | tee -a out/13-117.txt
          cat > renamed.json <<'JSON'
          {"macosVersion": "14", "pages": [[{"folder": {"name": "Renamed Test", "pages": [["com.apple.Notes.OLD-ID", "com.apple.TextEdit"]]}}, {"app": "com.apple.mail"}]],
           "names": {"com.apple.Notes.OLD-ID": "Notes"}}
          JSON
          ./sim launchpad-apply renamed.json 2>&1 | tee -a out/13-117.txt
          python3 - renamed.after.json <<'PY' 2>&1 | tee -a out/13-117.txt
          import json, sys
          after = json.load(open(sys.argv[1]))
          first = after["pages"][0]
          folder = next((e["folder"] for e in first if "folder" in e), None)
          print("first page:", json.dumps(first)[:300])
          print("Notes in 'Renamed Test':", bool(folder and folder["name"] == "Renamed Test" and "com.apple.Notes" in sum(folder["pages"], [])))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launchpad-macos-14
          path: out/

  office:
    if: false
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Old Homebrew (as brought back by Time Machine), then MacReplica's sequence (fail, brew update, again)
        run: |
          set +e -x
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; mkdir -p out
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ENV_HINTS=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_AUTOREMOVE=1 NONINTERACTIVE=1
          brew --version | tee out/brew-current.txt
          git -C "$(brew --repo)" fetch --tags --quiet
          git -C "$(brew --repo)" checkout --quiet 4.2.0
          brew --version | tee out/brew-old.txt
          arch_of() { for app in "$@"; do [ -d "$app" ] || { echo "$app: not there"; continue; }; exe="$app/Contents/MacOS/$(defaults read "$app/Contents/Info" CFBundleExecutable 2>/dev/null)"; echo "$app: $(lipo -archs "$exe" 2>&1)"; done; }
          for c in gimp microsoft-office; do
            echo "== $c (old Homebrew)"
            brew install --cask "$c" > "out/old-$c.txt" 2>&1; echo "exit=$?" >> "out/old-$c.txt"; tail -25 "out/old-$c.txt"
            brew list --cask --versions "$c" >> "out/old-$c.txt" 2>&1; echo "listed=$?" >> "out/old-$c.txt"
          done
          arch_of /Applications/GIMP.app "/Applications/Microsoft Word.app" "/Applications/Microsoft Excel.app" | tee out/apps-after-old.txt
          # What MacReplica 1.1.2+ does on this evidence: brew update once, then the same install again.
          git -C "$(brew --repo)" checkout --quiet master 2>/dev/null || git -C "$(brew --repo)" checkout --quiet main
          brew update > out/update.txt 2>&1; echo "exit=$?" >> out/update.txt; tail -5 out/update.txt
          brew --version | tee out/brew-updated.txt
          for c in gimp microsoft-office; do
            echo "== $c (after brew update)"
            brew install --cask "$c" > "out/new-$c.txt" 2>&1; echo "exit=$?" >> "out/new-$c.txt"; tail -25 "out/new-$c.txt"
            brew list --cask --versions "$c" >> "out/new-$c.txt" 2>&1; echo "listed=$?" >> "out/new-$c.txt"
          done
          arch_of /Applications/GIMP.app "/Applications/Microsoft Word.app" "/Applications/Microsoft Excel.app" | tee out/apps-after-update.txt
          ls -d /Applications/Microsoft* 2>&1 | tee out/office-apps.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-intel
          path: out/
