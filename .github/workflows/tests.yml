name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mutation:
        description: "Also run a sampled mutation test of the critical modules"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"   # weekly, including the sampled mutation test

permissions:
  contents: read

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Localization files are valid
        run: for f in Sources/MacReplicaCore/Resources/Localization/*.lproj/Localizable.strings; do plutil -lint "$f"; done
      - name: Unit, integration and end-to-end tests
        run: scripts/test.sh
      - name: Build the app bundle (universal)
        run: scripts/build-app.sh build
      - name: Package check
        run: |
          scripts/make-dmg.sh build
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/MacReplica.app/Contents/Info.plist)" = "io.github.itsab1989.MacReplica"
          lipo -info build/MacReplica.app/Contents/MacOS/MacReplica | grep -q "x86_64 arm64\|arm64 x86_64"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No personal paths or certificates in the repository
        run: |
          # Tests use the synthetic accounts "jane", "janet", "someone" and "x" to check redaction.
          ! git grep -nE '/Users/[A-Za-z]' -- . ':!.github/workflows/tests.yml' | grep -vE '/Users/(jane|janet|someone|x)([/"]|$)'
          ! git ls-files | grep -Ei '\.(p12|cer|pem|key|mobileprovision)$'

  mutation:
    name: Mutation test (sampled)
    if: github.event_name == 'schedule' || inputs.mutation
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Sampled mutation test of the critical modules
        run: |
          python3 tools/mutation/mutate.py --max-per-file 12 --report mutation-report --check \
            --files Restore/FileConflictAnalyzer.swift Restore/RestorePlanner.swift Support/SafeCleaner.swift \
                    System/CommandRunner.swift Credentials/Credentials.swift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-report/
